name: Build Catalog

on: [ push ]

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maicol07/actions/setup-js@v1
      - uses: google/wireit@setup-github-actions-caching/v1
      - run: pnpm build:catalog
        env:
          WIREIT_FAILURES: continue
