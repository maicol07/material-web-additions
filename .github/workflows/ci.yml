name: CI
# Shared pipeline of maicol07/actions: checks on PRs and main, then on main the release PR, and
# once it is merged the GitHub Release and the npm package. A job is overridden by replacing its
# `uses:` with steps of its own (same job name, so `needs` keeps working).
# ponytail: still pnpm, not Bun: bun cannot migrate the catalog's workspace link to the root
# package (oven-sh/bun#23026), and a fresh Bun resolution breaks the catalog's Lit SSR build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release half done on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security:
    uses: maicol07/actions/.github/workflows/security.yml@v2

  commit_lint:
    uses: maicol07/actions/.github/workflows/commit-lint.yml@v2

  build:
    uses: maicol07/actions/.github/workflows/js.yml@v2
    with:
      run: pnpm build

  # Not in release.needs: eslint.config.mjs crashes on load (eslint-plugin-wc has no default
  # export). Add it there once the config is fixed. Type checking runs in `build` (tsc).
  lint:
    uses: maicol07/actions/.github/workflows/js.yml@v2
    with:
      run: pnpm exec eslint .

  release:
    needs: [security, build]
    if: github.event_name == 'push' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: maicol07/actions/.github/workflows/release.yml@v2
    permissions:
      contents: write
      pull-requests: write
    with:
      # npm wants the version without the tag's `v`. npm ships with the runner's Node.js.
      bump: npm version "${VERSION#v}" --no-git-tag-version

  publish:
    needs: release
    # !cancelled(): otherwise the checks skipped on the release merge skip this job too.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.tag }}
    uses: maicol07/actions/.github/workflows/npm-publish.yml@v2
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}
